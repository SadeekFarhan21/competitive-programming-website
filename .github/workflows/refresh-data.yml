# Refreshes every judge once a day and backs the site's "Refresh now"
# button. The per-judge workflows (refresh-codeforces.yml, …) are manual-only
# for targeted re-runs and backfills.
name: Refresh submission data

on:
  schedule:
    - cron: "0 7 * * *" # daily at 07:00 UTC = 3 AM EDT (2 AM EST in winter)
  workflow_dispatch:
    inputs:
      full:
        description: Paginate the entire history (one-time backfill)
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: refresh-submission-data
  cancel-in-progress: false

jobs:
  refresh:
    uses: ./.github/workflows/refresh-platform.yml
    with:
      platforms: ""
      full: ${{ inputs.full == true }}
    secrets: inherit

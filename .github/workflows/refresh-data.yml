name: Refresh submission data

on:
  schedule:
    - cron: "0 * * * *" # refresh every hour
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: refresh-submission-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          package-manager-cache: false
      - name: Install dependencies
        run: corepack pnpm install --frozen-lockfile
      - name: Refresh data
        env:
          LEETCODE_SESSION: ${{ secrets.LEETCODE_SESSION }}
          CSES_SESSION: ${{ secrets.CSES_SESSION }}
          UVA_USERNAME: ${{ secrets.UVA_USERNAME }}
          UVA_USER_ID: ${{ secrets.UVA_USER_ID }}
          CODECHEF_API_URL: https://algo.farhansadeek.com/api/codechef
          REFRESH_CSES: ${{ github.event_name == 'workflow_dispatch' }}
        run: corepack pnpm refresh
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/submissions.json
          git diff --cached --quiet || git commit -m "chore: refresh submission data"
          git pull --rebase origin main
          git push
